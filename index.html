<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Team Indonesia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000; /* Background Hitam Pekat */
            font-family: 'Georgia', serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Tombol Ganti Versi di Pojok Kanan Atas */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 5px 12px;
            cursor: pointer;
            color: #fff;
            font-family: 'Georgia', serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            z-index: 100;
        }
        .lang-switch:hover { background: rgba(50, 50, 50, 1); }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px 20px 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Foto Profil Utama */
        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            background: #222;
        }

        .main-title { font-size: 22px; font-weight: bold; letter-spacing: 2px; margin: 0 0 5px 0; text-transform: uppercase; }
        .sub-title { font-size: 14px; letter-spacing: 1px; color: #dddddd; margin-bottom: 25px; text-transform: uppercase; }
        .crown-icon { font-size: 14px; margin-bottom: 15px; }

        /* Pemisah Kategori */
        .section-divider {
            display: flex; align-items: center; justify-content: center;
            margin: 20px 0 15px 0; font-size: 13px; color: #aaaaaa; letter-spacing: 1px;
        }
        .section-divider::before, .section-divider::after {
            content: ""; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.2); margin: 0 10px;
        }

        /* Kotak Tombol Member */
        .link-card {
            display: block; background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
            padding: 12px 15px; margin-bottom: 12px; text-decoration: none;
            color: #ffffff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease-in-out; cursor: pointer; text-align: left;
        }
        .link-card:hover { background: rgba(35, 35, 35, 1); transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.4); }
        .card-name { font-size: 15px; font-weight: bold; margin-bottom: 3px; }
        .card-role { font-size: 12px; color: #b0c4de; }

        /* Style untuk Footer */
        .site-footer {
            margin-top: 35px;
            font-size: 12px;
            color: #888888;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .site-footer a { color: #aaaaaa; text-decoration: none; }
        .site-footer a:hover { color: #ffffff; }

        /* POPUP MODAL (UI Detail Member saat diklik) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 90%;
            max-width: 360px;
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: #fff; font-size: 18px; cursor: pointer;
        }
        .modal-pic {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
            margin-bottom: 12px;
            background: #222;
        }
        .modal-name {
            font-size: 18px; font-weight: bold; margin-bottom: 5px;
        }
        .modal-desc {
            font-size: 12.5px; color: #ccc; margin-bottom: 20px; line-height: 1.4;
        }
        /* Tombol Medsos di dalam Popup */
        .social-btn-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .social-btn {
            display: block;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }
        .social-btn:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Tombol Ganti Bahasa -->
    <button class="lang-switch" id="langBtn" onclick="toggleLang()">EN</button>

    <div class="container">
        <!-- FOTO PROFIL UTAMA -->
        <img src="https://cdn.discordapp.com/avatars/1400213303711498421/55fab65f41da7be0c21ab087709c2043.png?size=256" alt="Profile" class="profile-pic">

        <!-- TAMPILAN UTAMA -->
        <h1 class="main-title" id="boxTitle">Tower Team Indonesia</h1>
        <div class="sub-title" id="boxSub">DAFTAR MEMBER TTID</div>
        <div class="crown-icon" id="boxBadge">Owner</div>

        <!-- LIST TOMBOL -->
        <div id="boxContent"></div>

        <!-- FOOTER BAWAH -->
      <div class="site-footer">Di Buat Oleh Bibixse</div>
      
        <div class="site-footer">
            Dibuat dengan 🌐 <a href="https://vercel.com/" target="_blank">Vercel</a>
        </div>
      
      <div class="site-footer">Di Bangun Oleh<a href="https://tower-team-indonesia.vercel.app/" target="_blank">TTID</a>
      </div>
    </div>

    <!-- POPUP UI DETAIL MEMBER -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-box" id="modalBox">
            <button class="close-btn" onclick="closeModalDirect()">✕</button>
            <img src="" alt="Member Pic" class="modal-pic" id="modalPic">
            <div class="modal-name" id="modalName">Nama Member</div>
            <div class="modal-desc" id="modalDesc">Deskripsi member akan muncul di sini.</div>
            <div class="social-btn-container" id="modalSocials">
                <!-- Tombol medsos diisi otomatis lewat script -->
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // PENGATURAN DATA (UBAH NAMA, FOTO, DESKRIPSI, & SOSMED MASING-MASING MEMBER DI SINI)
        // =========================================================================
        
        const data = {
            id: {
                btnText: "EN",
                title: "Tower Team Indonesia",
                sub: "DAFTAR MEMBER TTID",
                badge: "Owner",
                items: [
                    { 
                        type: 'link', 
                        name: "Bibixse", 
                        role: "Member Dan Owner Tower Team Indonesia", 
                        pic: "https://cdn.discordapp.com/avatars/1335209174468001814/b1aa295464d344ee22e20daac5b011a1.png?size=256",
                        description: "Halo! Saya Bibixse, owner sekaligus pendiri dari komunitas Tower Team Indonesia (TTID).",
                        socials: [
                            { name: "Website", url: "https://towerteamindonesiacom.vercel.app" },
                            { name: "Youtube", url: "https://youtube.com/@bibixse" },
                            { name: "X", url: "https://x.com/@bibixse" }
                        ]
                    },
                    { type: 'divider', text: "Co-Owner" },
                    { 
                        type: 'link', 
                        name: "Kazami", 
                        role: "Bisa Di Sebut Kazami Kaizen Co-Owner Dari TTID Sekaligus Teman", 
                        pic: "https://cdn.discordapp.com/avatars/1264065770414014484/1fb41d0421317b1593a5b1900607dc78.png?size=256",
                        description: "Bisa dipanggil Kazami Kaizen, bertugas sebagai Co-Owner TTID sekaligus teman Bibixse. Dia Adalah Seorang teman team yg ramah dan baik dia selalu membahas tentang gadget atau pun roblox dan lain nya",
                        socials: [
                            { name: "Youtube", url: "https://youtube.com/@KazamiKaizenID" },
                            { name: "no another", url: "#" }
                        ]
                    },
                    { 
                        type: 'link', 
                        name: "Aldo", 
                        role: "Bisa Di Sebut afz_aldoi Co-owner Dari TTID Dan Teman", 
                        pic: "https://cdn.discordapp.com/avatars/1372413100107632713/c1538301f775b285a90dfcca27a31410.png?size=256",
                        description: "Dikenal sebagai afz_aldoi, Co-owner TTID dan teman setia dalam berbagai project.",
                        socials: [
                            { name: "Youtube", url: "https://youtube.com/@aFz_ALDOi" },
                            { name: "tiktok", url: "https://tiktok.com/@afzxtki_aldoi" },
                          {name:"No Another Info", url:"" }
                        ]
                    },
                    { type: 'divider', text: "Friends" },
                    { 
                        type: 'link', 
                        name: "Candra", 
                        role: "Bisa Di Sebut candra seorang teman Dari REALITY", 
                        pic: "https://cdn.discordapp.com/avatars/1511282208193904731/5923bf4039c88e5c0962269f2424c931.png?size=256",
                        description: "dia adalah seorang penggambar yg punya bakat menggambar yang bagus walau sedikit penonton dan like pada video atau gambar nya dia selalu percaya diri untuk membangun karya indah",
                        socials: [
                            { name: "Youtube", url: "https://youtube.com/@Candra_00-e4i" },
                            { name: "X", url: "https://x.com/@candrarathekxekc" },
                          { name:"REALITY", url:"https://reality.app/profile/afd71081?adj_t=8ogcewh_z9yhix5 #REALITY" }
                        ]
                    },
                  { 
                        type: 'link', 
                        name: "Ruri san", 
                        role: "Bisa Di Sebut Ruri seorang teman Dari REALITY", 
                        pic: "https://yt3.googleusercontent.com/nFt60r1yE-366MQBqnKJl3FPd0RETFdp-Eybbkoe7YRBMFKqn0QX8efRuO14y1uV8zwfCSpu2w=s160-c-k-c0x00ffffff-no-rj",
                        description: "Seorang Penyanyi yang lumayan handal dalam menyanyi dak berkolaburiasi",
                        socials: [
                            { name: "Youtube", url: "https://youtube.com/@ruri_san-f7n" },
                            { name: "REALITY", url: "https://reality.app/profile/74eaeea7?adj_t=8ogcewh_z9yhix5 #REALITY" },
                          { name:"No Another info", url:"" }
                        ]
                    }
                ]
            },
            en: {
                btnText: "IND",
                title: "Tower Team English",
                sub: "TTEN MEMBERS List",
                badge: "Coming Soon",
                items: []
            }
        };

        let currentLang = 'id';

        function renderPage(lang) {
            const d = data[lang];
            document.getElementById('langBtn').innerText = d.btnText;
            document.getElementById('boxTitle').innerText = d.title;
            document.getElementById('boxSub').innerText = d.sub;
            document.getElementById('boxBadge').innerText = d.badge;

            let html = '';
            d.items.forEach((item, index) => {
                if (item.type === 'link') {
                    html += `<div class="link-card" onclick='openModal(${JSON.stringify(item)})'>
                                <div class="card-name">${item.name}</div>
                                <div class="card-role">${item.role}</div>
                             </div>`;
                } else if (item.type === 'divider') {
                    html += `<div class="section-divider">${item.text}</div>`;
                }
            });
            document.getElementById('boxContent').innerHTML = html;
        }

        // Fungsi Buka Popup
        function openModal(member) {
            document.getElementById('modalPic').src = member.pic;
            document.getElementById('modalName').innerText = member.name;
            document.getElementById('modalDesc').innerText = member.description;

            let socialHtml = '';
            if(member.socials) {
                member.socials.forEach(s => {
                    socialHtml += `<a href="${s.url}" class="social-btn" target="_blank">${s.name}</a>`;
                });
            }
            document.getElementById('modalSocials').innerHTML = socialHtml;

            document.getElementById('modalOverlay').classList.add('active');
        }

        // Fungsi Tutup Popup
        function closeModalDirect() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModal(event) {
            if (event.target.id === 'modalOverlay') {
                closeModalDirect();
            }
        }

        function toggleLang() {
            currentLang = currentLang === 'id' ? 'en' : 'id';
            renderPage(currentLang);
        }

        renderPage('id');
    </script>

</body>
</html>
